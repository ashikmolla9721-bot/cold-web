# Codemagic workflow for building Just Cold Shop APK
workflows:
  just-cold-shop-apk:
    name: Just Cold Shop APK Build
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    cache:
      cache_paths:
        - $HOME/.gradle/caches
    scripts:
      - name: Setup project & dependencies
        script: |
          set -e
          
          # প্রজেক্ট ফোল্ডারে প্রবেশ করা (যদি justcoldshop_app ফোল্ডার থাকে)
          if [ -d "justcoldshop_app" ]; then
            cd justcoldshop_app
          fi
          
          pwd && ls -la
          flutter --version
          flutter config --no-analytics

          # Gradle মেমরি এবং AndroidX কনফিগারেশন
          echo "org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G" >> android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

          flutter pub get
          echo "=== Setup OK ==="
      - name: Accept Android SDK licenses
        script: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
      - name: Build release APK
        script: |
          set -e
          
          # বিল্ড করার সময়ও নিশ্চিত করা যে আমরা সঠিক ফোল্ডারে আছি
          if [ -d "justcoldshop_app" ]; then
            cd justcoldshop_app
          fi

          flutter build apk --release

          ls -la build/app/outputs/flutter-apk/

          # রুট ফোল্ডারে APK কপি করা
          cp build/app/outputs/flutter-apk/app-release.apk ../JustColdShop.apk
          ls -la ../JustColdShop.apk
          echo "=== APK READY ==="
    artifacts:
      - JustColdShop.apk
      - build/app/outputs/flutter-apk/*.apk
      - justcoldshop_app/build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - ashikmolla9721@gmail.com
        notify:
          success: true
          failure: true